[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "post-training-multi-gpu"
version = "0.1.0"
description = "Standalone pi0.5 BC, IQL and critic post-training"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "Pillow>=10", "torch>=2.6,<2.8", "tensorboard>=2.15,<3", "huggingface-hub>=0.30,<1", "safetensors>=0.4,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
