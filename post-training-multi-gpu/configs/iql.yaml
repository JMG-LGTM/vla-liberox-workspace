# Full IQL from scratch; prefer critic.yaml -> iql_from_critic.yaml first.
# All selected policy data is used; critic metrics are training diagnostics.
schema_version: 1
method: iql
output_dir: outputs/iql
cache_dir: cache
model:
  checkpoint: models/pi05_liberox_torch
  backbone: full
  dtype: bfloat16
data:
  validation_fraction: 0.0
  seed: 7
training:
  global_batch_size: 64
  per_device_batch_size: 2
  gradient_accumulation_steps: auto
  optimizer_updates: 5000
  warmup_updates: 500
  learning_rate: 0.00003
  final_learning_rate: 0.000003
  seed: 7
  checkpoint_interval: 1000
  checkpoint_format: sharded
  validation_interval: 500
  log_interval: 50
critic:
  optimizer: adamw
  weight_decay: 0.01
  warmup_updates: 12500
  init_checkpoint: null
  image_size: 128
  random_shift_pad: 4
  expectile: 0.8
  beta: 3.0
  max_weight: 20.0
