# Server smoke: real pi0.5, 8 GPUs, only four optimizer updates.
# Prepare weights and data separately before running this configuration.
schema_version: 1
method: bc
output_dir: outputs/smoke
model:
  checkpoint: models/pi05_liberox_torch
  backbone: frozen
data:
  validation_fraction: 0.0
training:
  global_batch_size: 8
  per_device_batch_size: 1
  gradient_accumulation_steps: auto
  optimizer_updates: 4
  warmup_updates: 1
  checkpoint_interval: 2
  log_interval: 1
distributed:
  device: cuda
  backend: nccl
  workers_per_rank: 2
